name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Opt actions into Node.js 24 ahead of GitHub's 2026-06-02 default switch.
# Removes the "Node.js 20 actions are deprecated" warning without bumping
# action major versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (Windows amd64)
        run: wails build -platform windows/amd64 -clean -trimpath

      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-Windows
          path: build/bin/ProxySwitch.exe

  build-mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (macOS Intel)
        run: wails build -platform darwin/amd64 -clean -trimpath

      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - build/bin/ProxySwitch.app
          cd build/bin && zip -r ../../ProxySwitch-Mac-Intel.zip ProxySwitch.app

      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-Mac-Intel
          path: ProxySwitch-Mac-Intel.zip

  build-mac-arm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build (macOS ARM64)
        run: wails build -platform darwin/arm64 -clean -trimpath

      - name: Ad-hoc sign and zip
        run: |
          codesign --force --deep --sign - build/bin/ProxySwitch.app
          cd build/bin && zip -r ../../ProxySwitch-Mac-ARM.zip ProxySwitch.app

      - uses: actions/upload-artifact@v4
        with:
          name: ProxySwitch-Mac-ARM
          path: ProxySwitch-Mac-ARM.zip
